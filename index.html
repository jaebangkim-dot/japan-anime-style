      async function transformImageWithGemini(base64Data, mimeType, selectedArtwork, userCustomNotes = '', customApiKey = '') {
        const prompt = `Act as a world-class Japanese anime illustrator and animation artist.
Transform this source photo completely into the signature anime visual style of "${selectedArtwork.title}" created by ${selectedArtwork.artist}.
Key Style Guidelines to Apply:
1. Re-render all visual elements of the original photo into authentic Japanese animation artwork using ${selectedArtwork.artist}'s visual characteristics: ${selectedArtwork.stylePrompt}.
2. Retain the core subject structure, pose, composition, and perspective of the original photo, but translate every detail into crisp anime lines, expressive shading, lighting, and vibrant anime color palette.
3. Ensure the result looks like a high-budget feature film screen grab or artwork from ${selectedArtwork.title}.
${userCustomNotes ? `User artistic request: ${userCustomNotes}` : ''}`;

        const payload = {
          contents: [
            {
              role: 'user',
              parts: [
                { text: prompt },
                {
                  inlineData: {
                    mimeType: mimeType,
                    data: base64Data
                  }
                }
              ]
            }
          ],
          generationConfig: {
            responseModalities: ['TEXT', 'IMAGE']
          }
        };

        const apiKey = customApiKey || localStorage.getItem('artify_gemini_api_key') || "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${apiKey}`;

        let attempts = 0;
        const maxAttempts = 4;
        let delayMs = 1500;

        while (attempts < maxAttempts) {
          try {
            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              const errText = await response.text();
              throw new Error(`Gemini API Error (${response.status}): ${errText}`);
            }

            const result = await response.json();
            const candidate = result?.candidates?.[0];
            if (!candidate) {
              throw new Error("No candidate returned from Gemini model.");
            }

            // Find image inlineData in response
            const imagePart = candidate.content?.parts?.find(p => p.inlineData);
            
            if (imagePart && imagePart.inlineData?.data) {
              const resMime = imagePart.inlineData.mimeType || 'image/png';
              return `data:${resMime};base64,${imagePart.inlineData.data}`;
            }

            // Check if text was returned explaining safety block or refusal
            const textPart = candidate.content?.parts?.find(p => p.text);
            if (textPart?.text) {
              throw new Error(`Model Response: ${textPart.text}`);
            }

            throw new Error("The model did not return a valid stylized image.");
          } catch (error) {
            attempts++;
            if (attempts >= maxAttempts) {
              throw error;
            }
            await new Promise(res => setTimeout(res, delayMs));
            delayMs *= 2;
          }
        }
      }

      // Convert URL image to Base64
      async function imageUrlToBase64(url) {
        const response = await fetch(url);
        const blob = await response.blob();
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onloadend = () => {
            const dataUrl = reader.result;
            const commaIdx = dataUrl.indexOf(',');
            const base64 = dataUrl.substring(commaIdx + 1);
            resolve({ base64, mimeType: blob.type || 'image/jpeg', dataUrl });
          };
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      }

      function CameraModal({ isOpen, onClose, onCapture }) {
        const videoRef = useRef(null);
        const canvasRef = useRef(null);
        const [stream, setStream] = useState(null);
        const [facingMode, setFacingMode] = useState('user');
        const [cameraError, setCameraError] = useState(null);

        useEffect(() => {
          if (!isOpen) {
            stopCamera();
            return;
          }
          startCamera(facingMode);
          return () => stopCamera();
        }, [isOpen, facingMode]);

        const startCamera = async (mode) => {
          setCameraError(null);
          
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            setCameraError("Camera access is not supported or is blocked by your browser/iframe sandbox.");
            return;
          }

          try {
            if (stream) {
              stream.getTracks().forEach(t => t.stop());
            }
            
            let newStream;
            try {
              // Attempt standard constraints first
              newStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: mode }, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
              });
            } catch (constraintErr) {
              // Fallback to minimal video constraints for Mac desktops / FaceTime HD cameras
              console.warn("FacingMode constraint failed, falling back to basic video requirement:", constraintErr);
              newStream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
              });
            }

            setStream(newStream);
            if (videoRef.current) {
              videoRef.current.srcObject = newStream;
            }
          } catch (err) {
            console.error("Webcam access error:", err);
            setCameraError("Camera feed unavailable or permission denied.");
          }
        };

        const stopCamera = () => {
          if (stream) {
            stream.getTracks().forEach(t => t.stop());
            setStream(null);
          }
        };

        const handleFallbackFileUpload = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            const dataUrl = reader.result;
            const base64 = dataUrl.split(',')[1];
            onCapture({
              base64,
              mimeType: file.type || 'image/jpeg',
              dataUrl
            });
            stopCamera();
            onClose();
          };
          reader.readAsDataURL(file);
        };

        const takeSnapshot = () => {
          if (!videoRef.current) return;
          const video = videoRef.current;
          const canvas = canvasRef.current || document.createElement('canvas');
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          const ctx = canvas.getContext('2d');
          
          if (facingMode === 'user') {
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
          }
          
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
          const base64 = dataUrl.split(',')[1];
          onCapture({
            base64,
            mimeType: 'image/jpeg',
            dataUrl
          });
          stopCamera();
          onClose();
        };

          setFacingMode(prev => prev === 'user' ? 'environment' : 'user');

                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />

      function ComparisonSlider({ originalImg, stylizedImg, artworkTitle, artistName }) {
        const [sliderPos, setSliderPos] = useState(50);
        const [isDragging, setIsDragging] = useState(false);
        const containerRef = useRef(null);

        const handleMove = (e) => {
          if (!containerRef.current) return;
          const rect = containerRef.current.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const x = clientX - rect.left;
          let percent = (x / rect.width) * 100;
          if (percent < 0) percent = 0;
          if (percent > 100) percent = 100;
          setSliderPos(percent);
        };

        const handleMouseDown = () => setIsDragging(true);
        const handleMouseUp = () => setIsDragging(false);

        useEffect(() => {
          if (isDragging) {
            window.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleMouseUp);
            window.addEventListener('touchmove', handleMove);
            window.addEventListener('touchend', handleMouseUp);
          }
          return () => {
            window.removeEventListener('mousemove', handleMove);
            window.removeEventListener('mouseup', handleMouseUp);
            window.removeEventListener('touchmove', handleMove);
            window.removeEventListener('touchend', handleMouseUp);
          };
        }, [isDragging]);

        return (
          <div className="relative w-full h-full min-h-[360px] max-h-[600px] rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 shadow-2xl group select-none">
            <div 
              ref={containerRef}
              className="relative w-full h-full cursor-col-resize overflow-hidden flex items-center justify-center"
              onMouseDown={handleMouseDown}
              onTouchStart={handleMouseDown}
              onClick={handleMove}
            >
              {/* Stylized Image (Full background) */}
              <img 
                src={stylizedImg} 
                alt="Stylized Anime Masterpiece" 
                className="absolute inset-0 w-full h-full object-contain pointer-events-none"
              />

              {/* Original Image (Clipped overlay) */}
              <div 
                className="absolute inset-0 overflow-hidden pointer-events-none"
                style={{ width: `${sliderPos}%` }}
              >
                <img 
                  src={originalImg} 
                  alt="Original Photo" 
                  className="absolute top-0 left-0 h-full w-auto max-w-none object-contain"
                  style={{ width: containerRef.current ? `${containerRef.current.clientWidth}px` : '100%' }}
                />
                <div className="absolute top-4 left-4 bg-black/70 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold text-white border border-white/20">
                  Original Photo
                </div>
              </div>

              {/* Labels */}
              <div className="absolute top-4 right-4 bg-pink-500/90 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold text-white border border-pink-300/40 shadow-lg pointer-events-none">
                {artworkTitle}
              </div>

              {/* Slider Divider Line */}
              <div 
                className="absolute top-0 bottom-0 w-1 bg-white shadow-[0_0_12px_rgba(255,255,255,0.8)] z-20 pointer-events-none"
                style={{ left: `${sliderPos}%` }}
              >
                <div className="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-9 h-9 rounded-full bg-white text-slate-900 shadow-xl border-2 border-pink-400 flex items-center justify-center pointer-events-auto cursor-grab active:cursor-grabbing">
                  <svg className="w-4 h-4 text-slate-800" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M8 7l-5 5m0 0l5 5m-5-5h18" />
                  </svg>
                </div>
              </div>
            </div>

            {/* Instruction Banner */}
            <div className="absolute bottom-3 left-1/2 -translate-x-1/2 bg-slate-900/80 backdrop-blur-md px-4 py-1.5 rounded-full text-[11px] text-slate-300 border border-slate-700/60 pointer-events-none shadow-lg">

            setErrorMessage(null);
          } catch (e) {

          }

          if (!file) return;

          if (!file.type.startsWith('image/')) {
            setErrorMessage("Please select a valid image file (JPG, PNG, WEBP).");
            return;
          }

          const reader = new FileReader();
          reader.onload = () => {

            setSourceImage({

              mimeType: file.type,
              dataUrl

            setResultImage(null);

                          {/* Image preview thumbnail */}
                          <div className="relative h-28 w-full overflow-hidden bg-slate-950">
                            <img 
                              src={artwork.previewImg} 
                              alt={artwork.title} 
                              className="w-full h-full object-cover"
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent opacity-80" />
                            
                            {/* Selected Badge */}
                            {isSelected && (
                              <div className="absolute top-2 right-2 bg-pink-500 text-white rounded-full p-1 shadow-md">
                                <svg className="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
                                  <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" />
                                </svg>
                              </div>
                            )}
                            <span className="absolute bottom-2 left-2 text-[10px] font-semibold text-pink-300 bg-black/60 px-2 py-0.5 rounded backdrop-blur-sm">
                              {artwork.movement}
                            </span>
                          </div>

                          {/* Card details */}
                          <div className="p-3 flex-1 flex flex-col justify-between">
                            <div>
                              <h3 className="text-xs font-bold text-white line-clamp-1">
                                {artwork.title}
                              </h3>
                              <p className="text-[11px] text-pink-400 font-medium mt-0.5">{artwork.artist}</p>
                              <p className="text-[10px] text-slate-400 mt-1 line-clamp-2 leading-relaxed">
                                {artwork.description}
                              </p>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* Optional Custom Instructions */}
                  <div className="mt-4 pt-4 border-t border-slate-800">
                    <label className="block text-xs font-medium text-slate-300 mb-1">
                      Optional Style Tweaks / Prompt Notes:
                    </label>
                    <input 
                      type="text"
                      value={customNotes}
                      onChange={(e) => setCustomNotes(e.target.value)}
                      placeholder="e.g. Add cherry blossom petals floating, emphasize vibrant blue sky..."
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-pink-400"
                    />
                  </div>

                  {/* Transform Trigger Button */}
                  <div className="mt-5">
                    <button
                      onClick={handleTransform}
                      disabled={isProcessing || !sourceImage}
                      className={`w-full py-3.5 px-6 rounded-xl font-bold text-sm transition flex items-center justify-center space-x-2 shadow-lg ${
                        isProcessing || !sourceImage
                          ? 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700'
                          : 'bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-600 hover:from-pink-400 hover:to-indigo-500 text-white shadow-pink-500/20 active:scale-[0.99]'
                      }`}
                    >
                      {isProcessing ? (
                        <>
                          <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                          </svg>
                          <span>Transforming Photo to Anime...</span>
                        </>
                      ) : (
                        <>
                          <svg className="w-5 h-5 text-pink-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                          </svg>
                          <span>Generate {selectedArtwork.title}</span>
                        </>
                      )}
                    </button>
                  </div>
                </div>
              </section>

              {/* RIGHT COLUMN: Interactive Comparison Canvas & Results (6 cols) */}
              <section className="lg:col-span-6 flex flex-col space-y-6">
                <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-xl backdrop-blur-md flex-1 flex flex-col justify-between">
                  <div className="flex items-center justify-between mb-4">
                    <div>
                      <h2 className="text-sm font-bold text-white uppercase tracking-wider">Transformation Studio Canvas</h2>
                      <p className="text-xs text-slate-400">Interactive before/after anime preview</p>
                    </div>
                    {resultImage && (
                      <button
                        onClick={handleDownload}
                        className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-3.5 py-1.5 rounded-xl text-xs transition flex items-center space-x-1.5 shadow-md shadow-emerald-500/20"
                      >
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        <span>Download HD</span>
                      </button>
                    )}
                  </div>

                  {/* Main Display Area */}
                  <div className="flex-1 flex items-center justify-center min-h-[400px]">
                    {isProcessing ? (
                      <div className="flex flex-col items-center justify-center p-8 text-center space-y-4">
                        <div className="relative w-20 h-20">
                          <div className="absolute inset-0 rounded-full border-4 border-pink-500/20 animate-ping"></div>
                          <div className="absolute inset-0 rounded-full border-4 border-t-pink-500 border-r-purple-500 border-b-transparent border-l-transparent animate-spin"></div>
                          <div className="absolute inset-2 rounded-full bg-slate-900 flex items-center justify-center">
                            <span className="text-2xl">✨</span>
                          </div>
                        </div>
                        <div>
                          <p className="text-sm font-bold text-white animate-pulse">{processStep}</p>
                          <p className="text-xs text-slate-400 mt-1">Generating high quality anime art with Gemini 3.1 Flash Image...</p>
                        </div>
                      </div>
                    ) : resultImage ? (
                      <ComparisonSlider 
                        originalImg={sourceImage.dataUrl} 
                        stylizedImg={resultImage}
                        artworkTitle={selectedArtwork.title}
                        artistName={selectedArtwork.artist}
                      />
                    ) : sourceImage ? (
                      <div className="relative w-full h-full min-h-[380px] rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 flex items-center justify-center group">
                        <img src={sourceImage.dataUrl} alt="Original Preview" className="max-h-[500px] w-auto object-contain" />
                        <div className="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-950/30 to-transparent flex flex-col items-center justify-end p-6 text-center">
                          <p className="text-sm font-bold text-white mb-1">Source Photo Loaded</p>
                          <p className="text-xs text-slate-300 max-w-md">Click <span className="text-pink-400 font-semibold">"Generate {selectedArtwork.title}"</span> on the left panel to begin transformation.</p>
                        </div>
                      </div>
                    ) : (
                      <div className="border-2 border-dashed border-slate-800 rounded-2xl p-12 text-center flex flex-col items-center justify-center text-slate-500">
                        <svg className="w-12 h-12 text-slate-600 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <p className="text-sm font-medium text-slate-300">No Photo Selected</p>
                        <p className="text-xs text-slate-500 mt-1">Upload a photo or capture a snapshot to see the anime transformation comparison slider.</p>
                      </div>
                    )}
                  </div>

                  {/* Active Selected Style Info Bar */}
                  <div className="mt-4 p-3 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between text-xs">
                    <div className="flex items-center space-x-3">
                      <div className="w-8 h-8 rounded-lg overflow-hidden border border-slate-700">
                        <img src={selectedArtwork.previewImg} alt="Style" className="w-full h-full object-cover" />
                      </div>
                      <div>
                        <p className="font-bold text-white">{selectedArtwork.title}</p>
                        <p className="text-[10px] text-pink-400">{selectedArtwork.artist}</p>
                      </div>
                    </div>
                    <span className="text-[10px] text-slate-400 font-mono bg-slate-900 px-2 py-1 rounded border border-slate-800">
                      Model: gemini-3.1-flash-image
                    </span>
                  </div>
                </div>

                {/* Session Gallery History */}
                {galleryHistory.length > 0 && (
                  <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-xl backdrop-blur-md">
                    <h3 className="text-xs font-bold text-white uppercase tracking-wider mb-3">Session Anime Transformations</h3>
                    <div className="grid grid-cols-3 gap-3 max-h-[160px] overflow-y-auto pr-1 custom-scrollbar">
                      {galleryHistory.map(item => (
                        <div 
                          key={item.id}
                          onClick={() => setResultImage(item.stylized)}
                          className="group relative rounded-xl overflow-hidden border border-slate-800 hover:border-pink-400 cursor-pointer aspect-square bg-slate-950"
                        >
                          <img src={item.stylized} alt={item.artworkTitle} className="w-full h-full object-cover group-hover:scale-105 transition duration-200" />
                          <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition p-2 flex flex-col justify-end">
                            <p className="text-[10px] font-bold text-white line-clamp-1">{item.artworkTitle}</p>
                            <p className="text-[9px] text-pink-300">{item.timestamp}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </section>
            </main>

            {/* Footer */}
            <footer className="border-t border-slate-800/80 bg-slate-950 py-4 px-4 text-center text-xs text-slate-500">
              <p>Artify AI Studio: Anime Edition — Powered by Google Gemini 3.1 Flash Image model</p>
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
